<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img"><title>直播训练：让新人先练起来</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1d1c19}.eyebrow{font-size:21px;font-weight:700;fill:#c2491d}.title{font-size:42px;font-weight:700}.sub{font-size:22px;fill:#6e6b64}.node{font-size:29px;font-weight:700}.desc{font-size:21px;fill:#6e6b64}.body{font-size:23px}.line{fill:none;stroke:#c2491d;stroke-width:3;marker-end:url(#arrow)}.label{font-size:21px;font-weight:700;fill:#c2491d}.foot{font-size:20px;fill:#6e6b64}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2491d"/></marker></defs><rect width="1500" height="760" fill="#faf9f5"/><text x="70" y="65" class="eyebrow">案例 06  /  工作机制与实践建议</text><text x="70" y="132" class="title">直播训练：让新人先练起来</text><text x="70" y="178" class="sub">图示结合案例机制与本书实践建议；具体做法以案例卡为准。</text><rect x="70" y="230" width="400" height="192" rx="17" fill="#fff" stroke="#d6d3cb" stroke-width="2"/><text x="95" y="273" class="label">输入 / 背景</text><text x="95" y="325" class="node">核对产品信息</text><text x="95" y="375" class="desc">由人确认商品卖点</text><rect x="530" y="230" width="400" height="192" rx="17" fill="#fff" stroke="#d6d3cb" stroke-width="2"/><text x="555" y="273" class="label">关键动作</text><text x="555" y="325" class="node">生成练习话术</text><text x="555" y="375" class="desc">助手起草语言和结构</text><rect x="990" y="230" width="400" height="192" rx="17" fill="#fff" stroke="#d6d3cb" stroke-width="2"/><text x="1015" y="273" class="label">结果 / 下一步</text><text x="1015" y="325" class="node">朗读并修改</text><text x="1015" y="375" class="desc">留下不顺之处与修改理由</text><path d="M470 326 H523" class="line"/><path d="M930 326 H983" class="line"/><rect x="70" y="460" width="1360" height="170" rx="16" fill="#f4f2ec" stroke="#d6d3cb" stroke-width="1.5"/><text x="100" y="502" class="label">可以借鉴 · 本书建议</text><text x="100" y="541" class="body">选一个熟悉产品，生成一版练习稿并实际读出来。</text><text x="100" y="591" class="label">仍需人判断</text><text x="280" y="591" class="body">检查商品信息真实性、表达合规性与现场适用性。</text><text x="70" y="692" class="foot">练习稿顺畅，不等于成交或直播效果已经得到证明。</text></svg>