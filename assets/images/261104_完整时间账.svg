<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img"><title>时间账：生成更快，不代表交付真的更省</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1d1c19}.title{font-size:47px;font-weight:700}.sub{font-size:24px;fill:#6e6b64}.small{font-size:21px;fill:#6e6b64}.body{font-size:24px}.strong{font-size:27px;font-weight:650}.head{font-size:29px;font-weight:700}.tag{font-size:21px;font-weight:700;fill:#c2491d}.num{font-size:23px;font-weight:700;fill:white}.box{fill:#fff;stroke:#d6d3cb;stroke-width:2}.pale{fill:#f4f2ec;stroke:#d6d3cb;stroke-width:1.5}.accent{fill:#fff;stroke:#c2491d;stroke-width:2.5}.ln{stroke:#c2491d;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#c2491d;stroke-width:2.5;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2491d"/></marker></defs><rect width="1500" height="850" fill="#faf9f5"/><text x="70" y="76" class="tag">AI 有产阶层  /  实践图解</text><text x="70" y="145" class="title">时间账：生成更快，不代表交付真的更省</text><text x="70" y="190" class="sub">按同类任务、相同验收范围比较；维护单独记录。</text><rect x="70" y="245" width="405" height="345" rx="18" class="box"/><text x="100" y="290" class="tag">原方法</text><text x="100" y="352" class="head">90 分钟 / 份</text><text x="100" y="405" class="body">从准备到验收的完整耗时</text><text x="100" y="464" class="body">每月 4 份</text><text x="100" y="539" class="strong">每月 6 小时</text><rect x="547" y="245" width="405" height="345" rx="18" class="box"/><text x="577" y="290" class="tag">新流程</text><text x="577" y="352" class="head">45 分钟 / 份</text><text x="577" y="405" class="body">准备 15 + 生成 5</text><text x="577" y="444" class="body">检查修改 25 分钟</text><text x="577" y="539" class="strong">每月交付 3 小时</text><rect x="1024" y="245" width="405" height="345" rx="18" class="accent"/><text x="1054" y="290" class="tag">每月净节省</text><text x="1054" y="352" class="head">1 小时</text><text x="1054" y="405" class="body">交付节省 3 小时</text><text x="1054" y="444" class="body">减维护时间 2 小时</text><text x="1054" y="539" class="strong">另看质量与返工</text><path d="M475 420 H540" class="ln"/><path d="M952 420 H1017" class="ln"/><rect x="70" y="640" width="1360" height="125" rx="18" class="pale"/><text x="100" y="687" class="tag">搭建投入另算</text><text x="300" y="687" class="body">若初始搭建 6 小时，其他条件不变，约 6 个月回本。</text><text x="100" y="732" class="small">假设示例：质量相当、任务量与维护负担不变；缺少可比基线时，不计算净节省。</text></svg>