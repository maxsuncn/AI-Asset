<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560"><rect width="820" height="560" fill="#101010"/><text x="42" y="55" fill="#FF5A1F" font-size="13" font-weight="700" letter-spacing="2">AI 有产阶层｜思维导图</text><text x="42" y="105" fill="#F4F0E8" font-size="31" font-weight="800">五类资产不是清单，而是一条生产链</text><text x="42" y="137" fill="#AAA69E" font-size="14">问题定方向，数据供材料，判断保质量，流程促复用，信任带来新反馈。</text><rect x="44" y="235" width="128" height="126" rx="15" fill="#191919" stroke="#FF5A1F" stroke-width="1.4"/><text x="108" y="279" fill="#FF5A1F" font-size="21" font-weight="800" text-anchor="middle">问题</text><text x="108" y="317" fill="#AAA69E" font-size="12" font-weight="600" text-anchor="middle">找到值得解决的事</text><path d="M172 298 L202 298" fill="none" stroke="#FF5A1F" stroke-width="2"/><text x="187" y="282" fill="#FF5A1F" font-size="22" font-weight="700" text-anchor="middle">›</text><rect x="202" y="235" width="128" height="126" rx="15" fill="#191919" stroke="#4B4B4B" stroke-width="1.4"/><text x="266" y="279" fill="#F4F0E8" font-size="21" font-weight="800" text-anchor="middle">数据</text><text x="266" y="317" fill="#AAA69E" font-size="12" font-weight="600" text-anchor="middle">留下真实记录</text><path d="M330 298 L360 298" fill="none" stroke="#FF5A1F" stroke-width="2"/><text x="345" y="282" fill="#FF5A1F" font-size="22" font-weight="700" text-anchor="middle">›</text><rect x="360" y="235" width="128" height="126" rx="15" fill="#191919" stroke="#4B4B4B" stroke-width="1.4"/><text x="424" y="279" fill="#F4F0E8" font-size="21" font-weight="800" text-anchor="middle">判断</text><text x="424" y="317" fill="#AAA69E" font-size="12" font-weight="600" text-anchor="middle">决定什么算好</text><path d="M488 298 L518 298" fill="none" stroke="#FF5A1F" stroke-width="2"/><text x="503" y="282" fill="#FF5A1F" font-size="22" font-weight="700" text-anchor="middle">›</text><rect x="518" y="235" width="128" height="126" rx="15" fill="#191919" stroke="#4B4B4B" stroke-width="1.4"/><text x="582" y="279" fill="#F4F0E8" font-size="21" font-weight="800" text-anchor="middle">流程</text><text x="582" y="317" fill="#AAA69E" font-size="12" font-weight="600" text-anchor="middle">让结果可复用</text><path d="M646 298 L676 298" fill="none" stroke="#FF5A1F" stroke-width="2"/><text x="661" y="282" fill="#FF5A1F" font-size="22" font-weight="700" text-anchor="middle">›</text><rect x="676" y="235" width="128" height="126" rx="15" fill="#191919" stroke="#4B4B4B" stroke-width="1.4"/><text x="740" y="279" fill="#F4F0E8" font-size="21" font-weight="800" text-anchor="middle">信任</text><text x="740" y="317" fill="#AAA69E" font-size="12" font-weight="600" text-anchor="middle">进入持续合作</text><rect x="98" y="175" width="624" height="36" rx="9" fill="#201710" stroke="#603019" stroke-width="1.4"/><text x="410" y="199" fill="#FFC2A5" font-size="14" font-weight="700" text-anchor="middle">AI 降低整理、检索与执行成本；人保留方向、审核与责任</text><path d="M740 376 L740 428" fill="none" stroke="#FF5A1F" stroke-width="2"/><path d="M740 428 L110 428" fill="none" stroke="#FF5A1F" stroke-width="2"/><path d="M110 428 L110 375" fill="none" stroke="#FF5A1F" stroke-width="2"/><text x="425" y="455" fill="#FF5A1F" font-size="13" font-weight="700" text-anchor="middle">使用结果与新反馈回到“问题”，推动下一轮积累</text><rect x="160" y="478" width="500" height="34" rx="8" fill="#202020" stroke="#383838" stroke-width="1.4"/><text x="410" y="501" fill="#F4F0E8" font-size="13" font-weight="600" text-anchor="middle">起步顺序：先选一个真实问题，再积累支撑它的资产</text><text x="42" y="535" fill="#77736E" font-size="11" font-weight="500" text-anchor="start">科技小虎哥｜把一次工作，变成下一次的起点</text></svg>