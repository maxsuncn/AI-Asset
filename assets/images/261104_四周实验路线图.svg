<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img"><title>四周实验：让下一次不必从头开始</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1d1c19}.title{font-size:47px;font-weight:700}.sub{font-size:24px;fill:#6e6b64}.small{font-size:21px;fill:#6e6b64}.body{font-size:24px}.strong{font-size:27px;font-weight:650}.head{font-size:29px;font-weight:700}.tag{font-size:21px;font-weight:700;fill:#c2491d}.num{font-size:23px;font-weight:700;fill:white}.box{fill:#fff;stroke:#d6d3cb;stroke-width:2}.pale{fill:#f4f2ec;stroke:#d6d3cb;stroke-width:1.5}.accent{fill:#fff;stroke:#c2491d;stroke-width:2.5}.ln{stroke:#c2491d;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#c2491d;stroke-width:2.5;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2491d"/></marker></defs><rect width="1500" height="850" fill="#faf9f5"/><text x="70" y="76" class="tag">AI 有产阶层  /  实践图解</text><text x="70" y="145" class="title">四周实验：让下一次不必从头开始</text><text x="70" y="190" class="sub">选一个有真实使用者的任务；低频任务可以延长，不必凑样本。</text><rect x="70" y="255" width="315" height="355" rx="18" class="box"/><circle cx="109" cy="294" r="21" fill="#c2491d"/><text x="109" y="302" text-anchor="middle" class="num">1</text><text x="143" y="302" class="tag">第 1 周</text><text x="94" y="360" class="head">选定一个窄任务</text><text x="94" y="415" class="body">谁会使用？</text><text x="94" y="453" class="body">原来卡在哪一步？</text><line x1="94" y1="510" x2="361" y2="510" stroke="#d6d3cb"/><text x="94" y="548" class="small">留下</text><text x="94" y="585" class="strong">对象、问题与基线</text><rect x="418" y="255" width="315" height="355" rx="18" class="box"/><circle cx="457" cy="294" r="21" fill="#c2491d"/><text x="457" y="302" text-anchor="middle" class="num">2</text><text x="491" y="302" class="tag">第 2 周</text><text x="442" y="360" class="head">整理真实样本</text><text x="442" y="415" class="body">来源、日期与条件</text><text x="442" y="453" class="body">处理结果和例外</text><line x1="442" y1="510" x2="709" y2="510" stroke="#d6d3cb"/><text x="442" y="548" class="small">留下</text><text x="442" y="585" class="strong">可使用的样本记录</text><rect x="766" y="255" width="315" height="355" rx="18" class="box"/><circle cx="805" cy="294" r="21" fill="#c2491d"/><text x="805" y="302" text-anchor="middle" class="num">3</text><text x="839" y="302" class="tag">第 3 周</text><text x="790" y="360" class="head">做一个最小流程</text><text x="790" y="415" class="body">AI 起草，人来核验</text><text x="790" y="453" class="body">用缺信息等样例试跑</text><line x1="790" y1="510" x2="1057" y2="510" stroke="#d6d3cb"/><text x="790" y="548" class="small">留下</text><text x="790" y="585" class="strong">模板、验收点与错误</text><rect x="1114" y="255" width="315" height="355" rx="18" class="box"/><circle cx="1153" cy="294" r="21" fill="#c2491d"/><text x="1153" y="302" text-anchor="middle" class="num">4</text><text x="1187" y="302" class="tag">第 4 周</text><text x="1138" y="360" class="head">完成一次真实交付</text><text x="1138" y="415" class="body">记录总耗时与反馈</text><text x="1138" y="453" class="body">没有反馈则标为试跑</text><line x1="1138" y1="510" x2="1405" y2="510" stroke="#d6d3cb"/><text x="1138" y="548" class="small">留下</text><text x="1138" y="585" class="strong">交付记录与可复用项</text><path d="M385 438 H415" class="ln"/><path d="M733 438 H763" class="ln"/><path d="M1081 438 H1111" class="ln"/><rect x="70" y="660" width="1360" height="105" rx="18" class="pale"/><text x="100" y="704" class="tag">决定下一步</text><text x="270" y="704" class="body">有使用、质量可控 → 继续；负担过大 → 缩小；无法验收 → 暂停。</text><text x="100" y="744" class="small">实操示例：新人产品答疑 → 核对现行资料 → AI 起草 → 业务人员验收 → 收集反馈。</text></svg>