<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img"><title>九十天：从一次试用到下一笔投入</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1d1c19}.title{font-size:47px;font-weight:700}.sub{font-size:24px;fill:#6e6b64}.small{font-size:21px;fill:#6e6b64}.body{font-size:24px}.strong{font-size:27px;font-weight:650}.head{font-size:29px;font-weight:700}.tag{font-size:21px;font-weight:700;fill:#c2491d}.num{font-size:23px;font-weight:700;fill:white}.box{fill:#fff;stroke:#d6d3cb;stroke-width:2}.pale{fill:#f4f2ec;stroke:#d6d3cb;stroke-width:1.5}.accent{fill:#fff;stroke:#c2491d;stroke-width:2.5}.ln{stroke:#c2491d;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#c2491d;stroke-width:2.5;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2491d"/></marker></defs><rect width="1500" height="850" fill="#faf9f5"/><text x="70" y="76" class="tag">AI 有产阶层  /  实践图解</text><text x="70" y="145" class="title">九十天：从一次试用到下一笔投入</text><text x="70" y="190" class="sub">同一个任务持续记录；达到扩展条件后，一次只改变一项。</text><rect x="70" y="255" width="315" height="355" rx="18" class="box"/><circle cx="109" cy="294" r="21" fill="#c2491d"/><text x="109" y="302" text-anchor="middle" class="num">1</text><text x="143" y="302" class="tag">第 1—4 周</text><text x="94" y="360" class="head">先完成交付</text><text x="94" y="415" class="body">明确对象与验收人</text><text x="94" y="453" class="body">记录总耗时和反馈</text><line x1="94" y1="510" x2="361" y2="510" stroke="#d6d3cb"/><text x="94" y="548" class="small">留下</text><text x="94" y="585" class="strong">一个可用的最小版本</text><rect x="418" y="255" width="315" height="355" rx="18" class="box"/><circle cx="457" cy="294" r="21" fill="#c2491d"/><text x="457" y="302" text-anchor="middle" class="num">2</text><text x="491" y="302" class="tag">第 5—8 周</text><text x="442" y="360" class="head">重复并处理例外</text><text x="442" y="415" class="body">记录使用与返工</text><text x="442" y="453" class="body">检查旧资料和维护</text><line x1="442" y1="510" x2="709" y2="510" stroke="#d6d3cb"/><text x="442" y="548" class="small">留下</text><text x="442" y="585" class="strong">交付卡与异常记录</text><rect x="766" y="255" width="315" height="355" rx="18" class="box"/><circle cx="805" cy="294" r="21" fill="#c2491d"/><text x="805" y="302" text-anchor="middle" class="num">3</text><text x="839" y="302" class="tag">第 9—12 周</text><text x="790" y="360" class="head">有条件才扩展</text><text x="790" y="415" class="body">尝试一位新使用者</text><text x="790" y="453" class="body">或一个相近问题</text><line x1="790" y1="510" x2="1057" y2="510" stroke="#d6d3cb"/><text x="790" y="548" class="small">留下</text><text x="790" y="585" class="strong">新增工作与新错误</text><rect x="1114" y="255" width="315" height="355" rx="18" class="box"/><circle cx="1153" cy="294" r="21" fill="#c2491d"/><text x="1153" y="302" text-anchor="middle" class="num">4</text><text x="1187" y="302" class="tag">第 90 天左右</text><text x="1138" y="360" class="head">复盘并作选择</text><text x="1138" y="415" class="body">比较时间与质量</text><text x="1138" y="453" class="body">核对权限与人工判断</text><line x1="1138" y1="510" x2="1405" y2="510" stroke="#d6d3cb"/><text x="1138" y="548" class="small">留下</text><text x="1138" y="585" class="strong">继续 / 缩小 / 暂停 / 停止</text><path d="M385 438 H415" class="ln"/><path d="M733 438 H763" class="ln"/><path d="M1081 438 H1111" class="ln"/><rect x="70" y="660" width="1360" height="105" rx="18" class="pale"/><text x="100" y="703" class="tag">决策依据</text><text x="250" y="703" class="body">真实使用与反馈 + 可比较的时间和质量 + 维护负担 + 权限</text><text x="100" y="744" class="small">没有再次使用机会或反馈时，继续观察；低频任务可推迟复盘，不必强行扩展。</text></svg>