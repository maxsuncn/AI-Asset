<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560"><rect width="820" height="560" fill="#101010"/><text x="42" y="55" fill="#FF5A1F" font-size="13" font-weight="700" letter-spacing="2">AI 有产阶层｜思维导图</text><text x="42" y="105" fill="#F4F0E8" font-size="31" font-weight="800">三种复利路径：找一条主线，让其他资产来支撑</text><text x="42" y="137" fill="#AAA69E" font-size="14">五类资产可以组合；先让一个真实使用场景转起来。</text><rect x="42" y="190" width="218" height="316" rx="16" fill="#191919" stroke="#4B4B4B" stroke-width="1.4"/><circle cx="68" cy="220" r="14" fill="#FF5A1F"/><text x="68" y="225" fill="#101010" font-size="10" font-weight="800" text-anchor="middle">01</text><text x="90" y="226" fill="#F4F0E8" font-size="16" font-weight="800" text-anchor="start">数据驱动的决策服务</text><rect x="62" y="274" width="178" height="31" rx="8" fill="#202020" stroke="#383838" stroke-width="1.4"/><text x="151" y="295" fill="#FF5A1F" font-size="13" font-weight="650" text-anchor="middle">持续数据</text><path d="M151 305 L151 316" fill="none" stroke="#FF5A1F" stroke-width="1.6"/><rect x="62" y="317" width="178" height="31" rx="8" fill="#202020" stroke="#383838" stroke-width="1.4"/><text x="151" y="338" fill="#F4F0E8" font-size="13" font-weight="650" text-anchor="middle">专业判断</text><path d="M151 348 L151 359" fill="none" stroke="#FF5A1F" stroke-width="1.6"/><rect x="62" y="360" width="178" height="31" rx="8" fill="#202020" stroke="#383838" stroke-width="1.4"/><text x="151" y="381" fill="#F4F0E8" font-size="13" font-weight="650" text-anchor="middle">决策服务</text><path d="M151 391 L151 402" fill="none" stroke="#FF5A1F" stroke-width="1.6"/><rect x="62" y="403" width="178" height="31" rx="8" fill="#202020" stroke="#383838" stroke-width="1.4"/><text x="151" y="424" fill="#F4F0E8" font-size="13" font-weight="650" text-anchor="middle">反馈回流</text><text x="62" y="463" fill="#AAA69E" font-size="11" font-weight="500" text-anchor="start">新反馈补充数据，下一次判断更贴近</text><text x="62" y="482" fill="#AAA69E" font-size="11" font-weight="500" text-anchor="start">问题</text><rect x="301" y="190" width="218" height="316" rx="16" fill="#191919" stroke="#4B4B4B" stroke-width="1.4"/><circle cx="327" cy="220" r="14" fill="#91AED2"/><text x="327" y="225" fill="#101010" font-size="10" font-weight="800" text-anchor="middle">02</text><text x="349" y="226" fill="#F4F0E8" font-size="16" font-weight="800" text-anchor="start">判断积累的信任网络</text><rect x="321" y="274" width="178" height="31" rx="8" fill="#202020" stroke="#383838" stroke-width="1.4"/><text x="410" y="295" fill="#91AED2" font-size="13" font-weight="650" text-anchor="middle">专业判断</text><path d="M410 305 L410 316" fill="none" stroke="#91AED2" stroke-width="1.6"/><rect x="321" y="317" width="178" height="31" rx="8" fill="#202020" stroke="#383838" stroke-width="1.4"/><text x="410" y="338" fill="#F4F0E8" font-size="13" font-weight="650" text-anchor="middle">稳定表达</text><path d="M410 348 L410 359" fill="none" stroke="#91AED2" stroke-width="1.6"/><rect x="321" y="360" width="178" height="31" rx="8" fill="#202020" stroke="#383838" stroke-width="1.4"/><text x="410" y="381" fill="#F4F0E8" font-size="13" font-weight="650" text-anchor="middle">持续关系</text><path d="M410 391 L410 402" fill="none" stroke="#91AED2" stroke-width="1.6"/><rect x="321" y="403" width="178" height="31" rx="8" fill="#202020" stroke="#383838" stroke-width="1.4"/><text x="410" y="424" fill="#F4F0E8" font-size="13" font-weight="650" text-anchor="middle">新问题回流</text><text x="321" y="463" fill="#AAA69E" font-size="11" font-weight="500" text-anchor="start">结果与边界清楚，信任才有继续合作</text><text x="321" y="482" fill="#AAA69E" font-size="11" font-weight="500" text-anchor="start">的基础</text><rect x="560" y="190" width="218" height="316" rx="16" fill="#191919" stroke="#4B4B4B" stroke-width="1.4"/><circle cx="586" cy="220" r="14" fill="#7E9273"/><text x="586" y="225" fill="#101010" font-size="10" font-weight="800" text-anchor="middle">03</text><text x="608" y="226" fill="#F4F0E8" font-size="16" font-weight="800" text-anchor="start">流程支撑的组织生产</text><rect x="580" y="274" width="178" height="31" rx="8" fill="#202020" stroke="#383838" stroke-width="1.4"/><text x="669" y="295" fill="#7E9273" font-size="13" font-weight="650" text-anchor="middle">经验结构化</text><path d="M669 305 L669 316" fill="none" stroke="#7E9273" stroke-width="1.6"/><rect x="580" y="317" width="178" height="31" rx="8" fill="#202020" stroke="#383838" stroke-width="1.4"/><text x="669" y="338" fill="#F4F0E8" font-size="13" font-weight="650" text-anchor="middle">AI / Agent 协作</text><path d="M669 348 L669 359" fill="none" stroke="#7E9273" stroke-width="1.6"/><rect x="580" y="360" width="178" height="31" rx="8" fill="#202020" stroke="#383838" stroke-width="1.4"/><text x="669" y="381" fill="#F4F0E8" font-size="13" font-weight="650" text-anchor="middle">人工验收</text><path d="M669 391 L669 402" fill="none" stroke="#7E9273" stroke-width="1.6"/><rect x="580" y="403" width="178" height="31" rx="8" fill="#202020" stroke="#383838" stroke-width="1.4"/><text x="669" y="424" fill="#F4F0E8" font-size="13" font-weight="650" text-anchor="middle">经验再沉淀</text><text x="580" y="463" fill="#AAA69E" font-size="11" font-weight="500" text-anchor="start">每轮交付更新流程，减少重复解释与</text><text x="580" y="482" fill="#AAA69E" font-size="11" font-weight="500" text-anchor="start">返工</text><text x="410" y="532" fill="#FF5A1F" font-size="13" font-weight="700" text-anchor="middle">共同原则：反馈回流｜权限清楚｜保留人工责任</text><text x="42" y="535" fill="#77736E" font-size="11" font-weight="500" text-anchor="start">科技小虎哥｜把一次工作，变成下一次的起点</text></svg>